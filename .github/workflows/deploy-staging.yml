# Every push to main: build the app image tagged with the commit SHA, push it to GHCR and deploy it to
# staging: copy deploy/ to the staging directory on the server and run deploy.sh staging there
# (migrations -> new app -> smoke check of /health). Prod is not touched: it is deployed only by hand
# with the "Deploy prod" workflow, and only a SHA that has a green run of this workflow.
# The green runs of this workflow are the history of staging deploys that "Deploy prod" checks:
# rename this file only together with STAGING_WORKFLOW in deploy-prod.yml.
name: Deploy staging

on:
  push:
    branches: [main]

# Runs go one after another in the order of the pushes, so an older version never lands after a newer
# one: a newer push waits for the running deploy instead of cancelling it.
# deploy.sh also locks the environment on the server.
concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/valerakus/personal-crm
  APP_DIR: /srv/personal-crm-staging

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy staging
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/server-ssh
        with:
          ssh-key: ${{ secrets.DEPLOY_SSH_KEY }}
          known-hosts: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          host: ${{ vars.DEPLOY_HOST }}
          user: ${{ vars.DEPLOY_USER }}

      - name: Copy deploy scripts to the server
        run: tar -C deploy -cf - . | ssh server "tar -xf - --no-overwrite-dir -C $APP_DIR"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh server "$APP_DIR/deploy.sh staging $IMAGE:$GITHUB_SHA $GITHUB_ACTOR"

      - name: Summary
        run: |
          {
            echo "### Deployed to staging"
            echo
            echo "Version: \`$GITHUB_SHA\`"
            echo
            echo "This SHA can now go to prod: Actions -> Deploy prod -> Run workflow (leave the SHA empty for the latest staging version)."
          } >> "$GITHUB_STEP_SUMMARY"
