# Every push to main: build the app image tagged with the commit SHA, push it to GHCR, then deploy it
# to staging and to prod in parallel: copy deploy/ to the directory of the environment on the server
# and run deploy.sh there with the environment as a parameter (prod: backup -> migrations -> new app
# -> smoke check of /health; staging: the same without the backup). Prod does not wait for staging.
name: Deploy

on:
  push:
    branches: [main]

# Runs go one after another in the order of the pushes, so an older version never lands after a newer
# one: a newer push waits for the running deploy instead of cancelling it
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/valerakus/personal-crm

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          build-args: APP_VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy ${{ matrix.environment }}
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    strategy:
      # A failed staging deploy does not stop the prod deploy, and the other way round
      fail-fast: false
      matrix:
        include:
          - environment: staging
            app_dir: /srv/personal-crm-staging
          - environment: prod
            app_dir: /srv/personal-crm
    # Never two deploys of the same environment at once (deploy.sh also locks it on the server)
    concurrency:
      group: deploy-${{ matrix.environment }}
      cancel-in-progress: false
    env:
      ENVIRONMENT: ${{ matrix.environment }}
      APP_DIR: ${{ matrix.app_dir }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up SSH to the server
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host server
            HostName $DEPLOY_HOST
            User $DEPLOY_USER
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF

      - name: Copy deploy scripts to the server
        run: tar -C deploy -cf - . | ssh server "tar -xf - --no-overwrite-dir -C $APP_DIR"

      - name: Deploy
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | ssh server "$APP_DIR/deploy.sh $ENVIRONMENT $IMAGE:$GITHUB_SHA $GITHUB_ACTOR"
