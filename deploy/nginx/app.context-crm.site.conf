# HTTP: only certificate renewal, everything else goes to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name app.context-crm.site;

    access_log /var/log/nginx/app.context-crm.site.access.log;
    error_log /var/log/nginx/app.context-crm.site.error.log;

    include snippets/context-crm-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.context-crm.site;

    access_log /var/log/nginx/app.context-crm.site.access.log;
    error_log /var/log/nginx/app.context-crm.site.error.log;

    include snippets/context-crm-ssl.conf;

    # The app container, published only on localhost (deploy/compose.yaml)
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }
}
