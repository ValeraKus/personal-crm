# Staging. Closed with a password (basic auth); the file with it is made by hand, see README.
# Its own certificate, issued by setup-server.sh: the shared one of the landing and prod is not touched.

# HTTP: only certificate renewal, everything else goes to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name test-app.context-crm.site;

    access_log /var/log/nginx/test-app.context-crm.site.access.log;
    error_log /var/log/nginx/test-app.context-crm.site.error.log;

    include snippets/context-crm-acme.conf;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name test-app.context-crm.site;

    access_log /var/log/nginx/test-app.context-crm.site.access.log;
    error_log /var/log/nginx/test-app.context-crm.site.error.log;

    # Renewed by certbot (snap.certbot.renew.timer), nginx reloaded by its renew hook
    ssl_certificate /etc/letsencrypt/live/test-app.context-crm.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/test-app.context-crm.site/privkey.pem;

    # The same TLS settings as snippets/context-crm-ssl.conf (Mozilla "intermediate" profile).
    # That snippet also names the shared certificate, so it is not included here.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:ContextCrmSSL:10m;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # Everyone needs the password, except requests from the server itself: the deploy smoke check
    # of /health (deploy/lib.sh) goes to 127.0.0.1 and has no password
    satisfy any;
    allow 127.0.0.1;
    deny all;
    auth_basic "staging";
    auth_basic_user_file /etc/nginx/test-app.context-crm.site.htpasswd;

    # The staging app container, published only on localhost (deploy/compose.yaml, deploy/lib.sh)
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        # The password is for nginx only: the app does not get it
        proxy_set_header Authorization "";
    }
}
