schema: spec-driven

context: |
  Language: Russian
  All artifacts must be written in Russian.
  Keep OpenSpec structural headings and SHALL/MUST keywords in English.
  Code identifiers, file paths, table and column names stay in English.
  UI texts quoted in specs are in Russian, exactly as the user sees them.

  Project: personal CRM for people the owner knows personally.
  Product idea, main scenario, constraints and out-of-scope list:
  specs/01-продуктовая-идея.md. Working rules and stack: CLAUDE.md.
  What the app already does and how to run it: README.md.

  The owner is not a developer and makes all product decisions.
  Anything not covered by the product idea or the owner's request
  goes to open questions in the proposal, not into requirements.
  Write proposals and scenarios in plain words, so the owner can
  check each scenario by hand in the browser.

  Tech stack: Next.js (App Router), TypeScript, React, Tailwind CSS,
  shadcn/ui; colors, fonts and spacing only via design tokens
  (src/styles/tokens.css). PostgreSQL with Drizzle: schema in
  src/db/schema.ts, migrations in drizzle/. Data is accessed only
  on the server. pnpm. New libraries or services need the owner's
  approval.

rules:
  specs:
  - Every scenario has its own test
  tasks:
  - Test before code - write the test, run it and see it fail, then write the code and see the test pass

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing
